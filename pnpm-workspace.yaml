packages:
  - apps/*
  - packages/*

# One exact version per dependency for the whole workspace. Renovate proposes upgrades;
# Pi stays on the version the spec pins until a compatibility test passes on the next one.
catalog:
  "@blend-capital/blend-sdk": 3.3.1
  "@creit.tech/stellar-wallets-kit": 2.7.1
  "@base-ui/react": 1.9.0
  "@biomejs/biome": 2.6.3
  "@cloudflare/vite-plugin": 1.65.0
  "@cloudflare/vitest-plugin": 1.4.7
  "@cloudflare/workers-types": 5.20261023.1
  "@earendil-works/pi-agent-core": 1.4.0
  "@earendil-works/pi-ai": 1.4.0
  "@earendil-works/pi-coding-agent": 1.4.0
  "@earendil-works/pi-mcp": 1.4.0
  "@stellar/stellar-sdk": 17.3.0
  "@tailwindcss/vite": 4.3.3
  "@tanstack/react-query": 5.104.5
  "@tanstack/react-router": 1.170.46
  "@types/node": 24.19.2
  "@types/react": 19.3.0
  "@types/react-dom": 19.3.0
  "@vitejs/plugin-react": 6.1.2
  class-variance-authority: 0.7.1
  clsx: 2.1.1
  drizzle-kit: 0.31.11
  drizzle-orm: 0.45.4
  hono: 4.13.13
  knip: 6.43.0
  lefthook: 2.2.2
  lucide-react: 1.61.0
  react: 19.3.1
  react-dom: 19.3.1
  react-resizable-panels: 4.14.8
  shadcn: 4.22.1
  sonner: 2.0.8
  tailwind-merge: 3.7.0
  tailwindcss: 4.3.3
  turbo: 2.11.10
  tw-animate-css: 1.4.0
  typebox: 1.3.27
  typescript: 7.0.2
  vite: 8.3.5
  vitest: 5.0.5
  wrangler: 4.152.0
  zod: 4.6.7

# pnpm runs no dependency install scripts unless they are listed here.
allowBuilds:
  esbuild: true
  lefthook: true
  workerd: true
  # Pulled in by Pi's provider SDKs; their install scripts are not needed at runtime.
  "@google/genai": false
  protobufjs: false
  # Pulled in by the wallet kit's WalletConnect support. The browser bundle uses their JS fallbacks.
  "@reown/appkit": false
  bufferutil: false
  secp256k1: false
  utf-8-validate: false

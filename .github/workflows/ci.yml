name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      LEFTHOOK: "0"
      TURBO_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Verify preview chat
        run: |
          node design/nest/ui/scripts/verify-live-chat.js
          python3 design/nest/ui/scripts/test_live_chat.py
      - run: pnpm exec biome ci .
      - run: pnpm --filter @nest/worker types:check
      - run: pnpm turbo run typecheck test build
      - run: pnpm --filter @nest/web exec wrangler deploy --dry-run
      - run: pnpm knip

<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Nest responsive QA</title><style>body{margin:0;background:#0e150d;color:#eef0e2;font:14px system-ui}header{position:sticky;top:0;z-index:2;background:#0e150d;padding:12px 20px;display:flex;align-items:center;gap:16px}button{font:inherit;padding:8px 12px}iframe{display:block;border:1px solid #829179;margin:0 20px;transform-origin:top left;background:#0e150d}#result{margin-left:auto;font-size:12px;max-width:600px}</style></head><body><header><button data-width="375">375px</button><button data-width="1024">1024px</button><button data-width="1440">1440px</button><span id="result">Loading…</span></header><iframe title="Responsive preview" id="preview" src="../index.html#workspace" width="375" height="650"></iframe><script>const frame=document.getElementById('preview'),result=document.getElementById('result');function report(){const doc=frame.contentDocument;const w=Number(frame.getAttribute('width'));const overflow=[...doc.querySelectorAll('body *')].filter(e=>e.getBoundingClientRect().right>w+1&&!e.closest('.table-scroll')&&!e.closest('.guide-rail')&&getComputedStyle(e).position!=='fixed');result.textContent=JSON.stringify({width:w,pageWidth:doc.documentElement.scrollWidth,overflow:overflow.slice(0,6).map(e=>e.tagName+'.'+e.className)});frame.style.transform=`scale(${Math.min(1,(innerWidth-40)/w)})`;}frame.addEventListener('load',()=>{setTimeout(()=>{report();frame.contentWindow.scrollTo(0,frame.contentDocument.querySelector('#workspace').offsetTop-24)},200)});document.querySelectorAll('button').forEach(b=>b.onclick=()=>{frame.width=b.dataset.width;report();frame.contentWindow.scrollTo(0,frame.contentDocument.querySelector('#workspace').offsetTop-24)});</script></body></html>

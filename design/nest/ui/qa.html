<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Nest layout review</title><style>body{margin:0;background:#0e150d;color:#eef0e2;font:12px system-ui}header{display:flex;align-items:center;gap:10px;padding:12px 20px;height:60px}button,select{font:inherit;padding:8px}#result{margin-left:auto;max-width:600px}iframe{display:block;margin:0 20px;border:1px solid #829179;background:#0e150d;transform-origin:top left}</style><link rel="stylesheet" href="../typography.css?v=d26d0307"><link rel="stylesheet" href="../assets/fonts/fonts.css"></head><body><header><button data-width="375">375px</button><button data-width="1024">1024px</button><button data-width="1440">1440px</button><select id="route" aria-label="Screen"><option>chat</option><option>research-mcp</option><option>protocol-detail</option><option>asset-detail</option><option>saved</option><option>supply</option><option>activity</option><option>plan</option><option>connections</option><option>alerts</option><option>conversations</option><option>policy-states</option><option>wallet-access</option><option>research-defi</option><option>research-rwa</option><option>vaults</option><option>liquidity</option><option>liquidity-detail</option><option>vault-detail</option><option>trade</option><option>borrow</option><option>positions</option><option>lab-backtests</option><option>lab-automation</option><option>lab-history</option><option>portfolio</option></select><button id="batch">Run all layouts</button><span id="result">Loading</span></header><pre id="all-results" hidden></pre><iframe id="preview" title="Responsive Nest workspace" width="375" height="650"></iframe><script>const frame=document.getElementById('preview'),result=document.getElementById('result');function report(){const doc=frame.contentDocument,w=Number(frame.width),actual=doc.documentElement.clientWidth;const overflow=[...doc.querySelectorAll('body *')].filter(e=>e.getBoundingClientRect().right>actual+1&&!e.closest('.table-wrap,.memory-graph,.r-table-wrap,.r-league-table,.r-chart-scroll,.mkt-vault-tabs,.mkt-scope-controls')&&getComputedStyle(e).position!=='fixed'&&e.getBoundingClientRect().width>0);result.textContent=JSON.stringify({width:w,pageWidth:doc.documentElement.scrollWidth,route:document.getElementById('route').value,overflow:overflow.slice(0,6).map(e=>({tag:e.tagName,class:String(e.className)}))});frame.style.transform=`scale(${Math.min(1,(innerWidth-40)/w)})`;}frame.addEventListener('load',()=>{frame.contentDocument.fonts.ready.then(()=>requestAnimationFrame(report));frame.contentWindow.addEventListener('hashchange',()=>requestAnimationFrame(report));});document.querySelectorAll('[data-width]').forEach(b=>b.onclick=()=>{frame.width=b.dataset.width;requestAnimationFrame(()=>requestAnimationFrame(report));});document.getElementById('route').onchange=e=>{frame.src='index.html#'+e.target.value;setTimeout(report,300)};document.getElementById('batch').onclick=async()=>{const results=[];const rts=[...document.querySelector('#route').options].map(o=>o.value);for(const w of [375,1024,1440]){frame.width=w;for(const rt of rts){document.getElementById('route').value=rt;await new Promise(resolve=>{frame.addEventListener('load',resolve,{once:true});frame.src='index.html?qa='+w+'-'+rt+'#'+rt;});await frame.contentDocument.fonts.ready;await new Promise(resolve=>requestAnimationFrame(()=>requestAnimationFrame(resolve)));report();results.push(JSON.parse(result.textContent));}}const output=document.getElementById('all-results');output.hidden=false;output.textContent=JSON.stringify(results);result.textContent='Completed '+results.length+' layouts';};frame.src='index.html#trade';</script><script src="../typography.js?v=b82c5b77"></script></body></html>
